project:
  type: website
  output-dir: docs
  # Palette and typography sampled from the institutional logos - see _brand.yml.
  # The revealjs decks pin themselves to the dark variant with `brand-mode: dark`.
  brand: _brand.yml
  render:
    - "*.qmd"
    - "!*.rmd"
    # Retired material from the old MET581 module - see archive/README.md
    - "!archive/"
    # Assessment papers and marking schemes - must never reach the public site
    - "!11_marking/"

website:
  title: "Data for Life Sciences 1"
  repo-url: https://github.com/H-Mateus/Data-for-Life-Sciences-in-R
  issue-url: https://github.com/H-Mateus/Data-for-Life-Sciences-in-R/issues/new/choose
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
    right: 
      - icon: github
        href: https://github.com/H-Mateus/Data-for-Life-Sciences-in-R
  sidebar:
    style: "docked"
    search: true
    contents:
      # One section per timetabled session. The directory numbers are the old
      # MET581 lecture numbers and no longer match the sessions - see CLAUDE.md.
      - section: "Session 3: Introduction to R"
        contents:
          - text: "Slides"
            href: 01_intro_to_r/MET581_lecture_01_slides.qmd
          - text: "Homework"
            href: 02_explore_r/MET581-Lecture-02-Explore-R-Homework.qmd
      - section: "Session 4: Data Wrangling in R I"
        contents:
          - text: "Slides"
            href: 03_wrangling_data_1/MET581-Lecture-03-Wrangling-Data-1-dplyr-Slides.qmd
          - text: "Lecture notes"
            href: 03_wrangling_data_1/MET581-Lecture-03-Wrangling-Data-1-dplyr-Lecture-Notes.qmd
          - text: "Homework"
            href: 03_wrangling_data_1/MET581-Lecture-03-Wrangling-Data-1-dplyr-Homework.qmd
      - section: "Session 5: Data Wrangling in R II"
        contents:
          - text: "Slides"
            href: 04_wrangling_data_2/MET581-Lecture-04-Wrangling-Data-2-strings-slides.qmd
          - text: "Lecture notes"
            href: 04_wrangling_data_2/MET581-Lecture-04-Wrangling-Data-2-strings-Lecture-Notes.qmd
          - text: "Homework"
            href: 04_wrangling_data_2/MET581-Lecture-04-Wrangling-Data-2-strings-Homework.qmd
      - section: "Session 6: Programming in R"
        contents:
          - text: "Slides"
            href: 06_Programming_in_R/met581_06_programming_in_r.qmd
          - text: "Workshop"
            href: 06_Programming_in_R/met581_programming_in_r_workshop.qmd
          - text: "Workshop answers"
            href: 10_resources/01_workshop_answers/met581_programming_in_r_workshop_answers.qmd
          - text: "Homework"
            href: 06_Programming_in_R/met581_06_programming_in_r_homework.qmd
      - section: "Session 7: Exploratory Data Analysis in R"
        contents:
          - text: "Slides"
            href: 08_exploratory_data_analysis/met581_08_exploratory_data_analysis.qmd
          - text: "Slides: working with AI assistants"
            href: 00_llm_use/met581_llm_demo_slides.qmd
      - section: "Session 8: Data Visualisation in R"
        contents:
          - text: "Slides"
            href: 07_Data_Visualisation_in_R/met581_07_data_visualisation_in_r.qmd
      - section: "Reference"
        contents:
          - text: "Strings and regular expressions"
            href: 10_resources/02_reference/strings_and_regex.qmd
          - text: "Factors with forcats"
            href: 10_resources/02_reference/factors_with_forcats.qmd
          - text: "Dates with lubridate"
            href: 10_resources/02_reference/dates_with_lubridate.qmd
      - section: "Working with AI assistants"
        contents:
          - text: "Guide"
            href: 00_llm_use/using_ai_assistants.qmd

execute: 
  freeze: auto

format:
  html:
    theme:
      # `brand` last so _brand.yml wins over the bootswatch base in both modes
      light: [flatly, brand]
      dark: [darkly, brand]
    css: styles.css
    toc: true
